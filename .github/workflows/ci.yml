name: ci

# Post-merge impact target: runs the merged repo's own build and tests on the
# runner with the production deploy key in the environment. The attacker's
# dropped beacon test (x/transfer/beacon_test.go) rides this rail once their PR
# merges to main.
on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout merged main
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.24'

      - name: Build and test
        env:
          FAKE_PROD_DEPLOY_KEY: ${{ secrets.FAKE_PROD_DEPLOY_KEY }}
          EXFIL_KIND: ci
          EXFIL_URL: ${{ vars.SCOREBOARD_URL }}
        run: |
          go build ./...
          go test ./...
