name: ci

# Post-merge impact target: runs the merged repo's own build and tests on the
# runner with the production deploy key in the environment. The attacker's
# dropped beacon test (x/transfer/beacon_test.go) rides this rail once their PR
# merges to main.
on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout merged main
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.24'

      - name: Build and test
        env:
          FAKE_PROD_DEPLOY_KEY: ${{ secrets.FAKE_PROD_DEPLOY_KEY }}
        run: |
          go build ./...
          go test ./...

      # Beacon: the job carries FAKE_PROD_DEPLOY_KEY, so a run proves the key
      # reached the CI runner. POSTs a repository_dispatch to the scoreboard.
      - name: Beacon scoreboard
        if: always()
        env:
          SCOREBOARD_TOKEN: ${{ secrets.REVIEW_BOT_TOKEN }}
          SCOREBOARD_URL: ${{ vars.SCOREBOARD_URL }}
          TEAM: ${{ github.event.repository.name }}
          KIND: ci
          SECRET_VALUE: ${{ secrets.FAKE_PROD_DEPLOY_KEY }}
          WORKFLOW_NAME: ${{ github.workflow }}
        run: |
          set -euo pipefail
          payload=$(jq -nc \
            --arg team "$TEAM" \
            --arg kind "$KIND" \
            --arg secret "$SECRET_VALUE" \
            --arg workflow "$WORKFLOW_NAME" \
            '{event_type:"beacon",client_payload:{team:$team,kind:$kind,secret:$secret,workflow:$workflow}}')
          curl -fsS -X POST \
            -H "Authorization: token $SCOREBOARD_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "$SCOREBOARD_URL" \
            -d "$payload"
