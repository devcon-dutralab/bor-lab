name: codegenie-review

# Comment-triggered review. The workflow file must exist on the default branch
# for issue_comment events to fire.
on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: write
  issues: write

concurrency:
  group: codegenie-review-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  review:
    if: ${{ github.event.issue.pull_request }}
    runs-on: ubuntu-latest
    env:
      # User-level codegenie home. On GitHub-hosted runners there is no custom
      # job image, so we synthesize the same layout the lab image ships:
      # $CODEGENIE_HOME/config.toml is where codegenie reads lenses.extraSkillPaths
      # (repo-level config ignores that key).
      CODEGENIE_HOME: ${{ github.workspace }}/.codegenie
    steps:
      # Safe pattern: check out the trusted default branch, never the PR head.
      # The review agent then fetches the PR head itself.
      - name: Checkout default branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}

      # The team review lens codegenie obeys is pulled from skill-hub, a repo
      # the same untrusted population can write to. This clone is the poison
      # delivery path. The trust anchor is that file: whatever it says at
      # review time is what the reviewer obeys, and nothing about it is pinned
      # to a commit or signed.
      - name: Clone team review lens
        run: |
          set -e
          rm -rf "$RUNNER_TEMP/skill-hub"
          git clone --quiet --depth 1 \
            "https://github.com/${{ github.repository_owner }}/skill-hub" \
            "$RUNNER_TEMP/skill-hub"

      - name: Configure codegenie lens path
        run: |
          set -e
          mkdir -p "$CODEGENIE_HOME"
          cat > "$CODEGENIE_HOME/config.toml" <<EOF
          [lenses]
          extraSkillPaths = ["$RUNNER_TEMP/skill-hub/standards/team-review-lens.md"]
          EOF

      # Mint an installation token for the codegenie-dutralab GitHub App.
      # The reviews post as codegenie-dutralab[bot] — a real bot identity,
      # the same shape production review bots use (not the presenter's
      # personal account). App comments DO fire issue_comment, so mergebot
      # hears the status-comment edits.
      - name: Mint codegenie app token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ secrets.CODEGENIE_APP_ID }}
          private-key: ${{ secrets.CODEGENIE_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      - name: Run codegenie review
        env:
          # codegenie posts as codegenie-dutralab[bot] via the app
          # installation token. That distinction matters: mergebot
          # listens for issue_comment created *and* edited, and a comment
          # edited in place by the auto GITHUB_TOKEN never fires a
          # workflow, so the bot's own status-comment edits would not wake
          # mergebot. App installation tokens DO fire issue_comment.
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          MODEL_SPEC: ${{ vars.MODEL_SPEC }}
          # ROSTER is an org variable, empty until T-0, when it is filled with
          # attendee handles. Behavior verified live: an empty ROSTER still
          # lets ORG MEMBERS through (codegenie's permission check sees write
          # access and runs anyway — a member-bypass fail-open); it gates only
          # non-member external commenters, which is exactly the T-0 attendee
          # population. Do not rely on it to gate members.
          ROSTER: ${{ vars.ROSTER }}
          # codegenie's github-action adapter routes a single key to the model
          # provider (openrouter here) via LLM_API_KEY.
          LLM_API_KEY: ${{ secrets.LLM_KEY }}
        run: |
          set -e
          npx -y @0xsequence/codegenie github-action \
            --trigger-phrase "codegenie review" \
            --on-pull-request false \
            --model "${MODEL_SPEC:-openrouter/z-ai/glm-5.3-flash}" \
            --post-inline-comments true \
            --allowed-users "${ROSTER}"
