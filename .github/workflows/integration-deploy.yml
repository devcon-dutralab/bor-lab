name: integration-deploy

# THE VULNERABLE WORKFLOW.
#
# pull_request_target runs with repo secrets in scope and the workflow taken
# from the default branch, which is the safe half. The unsafe half is the
# checkout: it fetches the PR *head* and runs repo code (go test ./...) with
# FAKE_PROD_DEPLOY_KEY in the environment. An attacker PR therefore executes
# code with secrets before any review or merge.
on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      # actions/checkout pinned by full commit SHA (v4.2.2). A tag ref is
      # mutable, so pinning to the SHA is the supply-chain control. Station 3
      # teaches this: compare it against the unpinned actions in cli-lab.
      - name: Checkout PR head (VULNERABLE)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          repository: ${{ github.event.pull_request.head.repo.full_name }}

      # Go toolchain setup, pinned by full commit SHA (v5) for the same reason
      # as the checkout above: tag refs are mutable.
      - name: Set up Go (pinned)
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.24'

      - name: Run integration deploy
        env:
          FAKE_PROD_DEPLOY_KEY: ${{ secrets.FAKE_PROD_DEPLOY_KEY }}
          # Realistic: deploy jobs hold the CI bot's PAT so they can label,
          # comment on, or promote releases. It makes this job a privilege
          # escalation target as well as a secret-exfil target.
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
        run: |
          go build ./...
          go test ./...

      # Beacon: this job runs PR-head code with FAKE_PROD_DEPLOY_KEY in the
      # environment, so a run is the pr-head-ci impact proof. POSTs a
      # repository_dispatch to the scoreboard.
      - name: Beacon scoreboard
        if: always()
        env:
          SCOREBOARD_TOKEN: ${{ secrets.SCOREBOARD_TOKEN }}
          SCOREBOARD_URL: ${{ vars.SCOREBOARD_URL }}
          TEAM: ${{ github.event.repository.name }}
          KIND: pr-head-ci
          SECRET_VALUE: ${{ secrets.FAKE_PROD_DEPLOY_KEY }}
          WORKFLOW_NAME: ${{ github.workflow }}
        run: |
          set -euo pipefail
          payload=$(jq -nc \
            --arg team "$TEAM" \
            --arg kind "$KIND" \
            --arg secret "$SECRET_VALUE" \
            --arg workflow "$WORKFLOW_NAME" \
            '{event_type:"beacon",client_payload:{team:$team,kind:$kind,secret:$secret,workflow:$workflow}}')
          curl -fsS -X POST \
            -H "Authorization: token $SCOREBOARD_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "$SCOREBOARD_URL" \
            -d "$payload"
